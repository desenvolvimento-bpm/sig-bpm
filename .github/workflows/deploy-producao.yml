name: Deploy (produção)

# Dispara em todo push em main (merge de develop ou hotfix/*).
# Produção do SIG em Docker no srv-docker (192.168.0.16), porta 3020, banco sig_bpm (192.168.0.40).
#
# O repositório completo fica no servidor em /root/dados/sig-bpm (padrão da casa: /root/dados/<repo>), junto com o
# .env (segredos) e a pasta dados/ (uploads, back-ups), que não vão para o git. O runner self-hosted
# srv-docker-sig-bpm atualiza essa pasta para o commit do push e sobe os contêineres a partir dela.
# Nenhum secret do GitHub é usado; o token do próprio job só serve para o git fetch (vale também com o repo privado).
#
# Ordem pensada para nunca deixar a produção quebrada:
#   1. atualiza o código e faz o build da imagem nova (a versão antiga segue no ar);
#   2. liga o modo de publicação (o SIG fica só para consulta) e faz o back-up do banco — sem back-up, para aqui;
#   3. migrações — se falharem, para aqui e a versão antiga segue no ar;
#   4. troca os contêineres e espera o healthcheck;
#   5. desliga o modo de publicação (sempre, mesmo com erro).
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-sig-producao
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: [self-hosted, srv-docker]
    timeout-minutes: 45
    env:
      APP_HOME: /root/dados/sig-bpm
      ENV_FILE: /root/dados/sig-bpm/.env
    defaults:
      run:
        working-directory: /root/dados/sig-bpm
    steps:
      - name: Confere o servidor (pasta, .env e disco)
        run: |
          test -d .git || { echo "::error::$APP_HOME não é um clone do repositório."; exit 1; }
          test -r "$ENV_FILE" || { echo "::error::$ENV_FILE não existe ou não é legível pelo runner."; exit 1; }
          mkdir -p dados/uploads dados/backups
          LIVRE=$(df -BG --output=avail / | tail -1 | tr -dc '0-9')
          if [ "$LIVRE" -lt 10 ]; then echo "::error::Só ${LIVRE} GB livres no disco do servidor — deploy interrompido."; exit 1; fi
          echo "Disco livre: ${LIVRE} GB"

      - name: Atualiza o código na pasta do servidor
        env:
          TOKEN: ${{ github.token }}
        run: |
          AUTH=$(printf 'x-access-token:%s' "$TOKEN" | base64 -w0)
          git -c http.https://github.com/.extraheader="AUTHORIZATION: basic $AUTH" fetch --no-tags -q origin main
          git reset -q --hard "$GITHUB_SHA"
          git --no-pager log -1 --oneline

      - name: Build da imagem (a versão antiga segue no ar)
        run: |
          docker image inspect sig-bpm:producao >/dev/null 2>&1 && docker tag sig-bpm:producao sig-bpm:producao-anterior || true
          docker compose build

      - name: Modo de publicação (SIG só para consulta)
        run: echo deploy > dados/.publicacao-em-andamento

      - name: Back-up do banco (pg_dump)
        run: |
          U=$(grep -m1 '^DATABASE_URL=' "$ENV_FILE" | cut -d= -f2-)
          B="dados/backups/sig_bpm-$(date +%F-%H%M)-${GITHUB_SHA::7}.dump"
          if ! docker run --rm postgres:15 pg_dump -Fc "$U" > "$B" || [ ! -s "$B" ]; then
            rm -f "$B"
            echo "::error::O back-up do banco falhou — deploy interrompido, a produção segue na versão anterior."
            exit 1
          fi
          echo "Back-up: $B ($(du -h "$B" | cut -f1))"
          ls -1t dados/backups/sig_bpm-*.dump | tail -n +16 | xargs -r rm -f

      # Se a migração falhar, o job para AQUI e a versão antiga continua no ar. Para voltar o banco, use o back-up acima.
      - name: Migrações (prisma migrate deploy)
        run: docker compose run --rm migrate

      - name: Troca os contêineres (espera o healthcheck)
        run: docker compose up -d --wait --wait-timeout 180 backend frontend

      - name: Desliga o modo de publicação
        if: always()
        run: rm -f dados/.publicacao-em-andamento

      - name: Status
        if: always()
        run: |
          docker compose ps
          docker compose logs --tail 50 backend

      # Só as imagens soltas. O cache de build é compartilhado com os outros sistemas do servidor e não é apagado aqui.
      - name: Limpeza de imagens soltas
        if: always()
        run: docker image prune -f
