# SIG BPM — produção no srv-docker (192.168.0.16). Banco externo: PostgreSQL 192.168.0.40 (sig_bpm).
#
# Fica na pasta do repositório no servidor, /root/dados/sig-bpm, junto com:
#   .env    segredos (DATABASE_URL, JWT_SECRET, CORS_ORIGIN, API_EXTERNA, TOTVS...) — só no servidor, nunca no git
#   dados/  uploads, back-ups e o sinal de publicação — só no servidor, nunca no git
# Quem atualiza e sobe é o workflow .github/workflows/deploy-producao.yml (runner srv-docker-sig-bpm).
# Na mão, de dentro da pasta: docker compose ps | docker compose logs --tail 100 backend | docker compose exec backend sh

name: sig-bpm

x-logs: &logs
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"

services:
  backend:
    build: .
    image: sig-bpm:producao
    container_name: sig-bpm-backend
    working_dir: /app/backend
    command: ["node", "dist/server.js"]
    env_file: ./.env
    environment:
      NODE_ENV: production
      PORT: "3001"
      UPLOAD_DIR: /dados/uploads
    volumes:
      - ./dados:/dados
    restart: unless-stopped
    <<: *logs
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3001/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  frontend:
    image: sig-bpm:producao
    container_name: sig-bpm-frontend
    working_dir: /app/frontend
    command: ["npx", "next", "start", "-p", "3000"]
    environment:
      NODE_ENV: production
      BACKEND_URL: http://backend:3001
    ports:
      - "3020:3000"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    <<: *logs
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/',{redirect:'manual'}).then(r=>process.exit(r.status<500?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 30s

  # Só para o deploy: aplica as migrações com a imagem nova, antes de trocar os contêineres.
  migrate:
    image: sig-bpm:producao
    profiles: ["ferramentas"]
    working_dir: /app/backend
    command: ["npx", "prisma", "migrate", "deploy"]
    env_file: ./.env
    environment:
      NODE_ENV: production
